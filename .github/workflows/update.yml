name: Update available-soon feed
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build feed
        env:
          HOSTAWAY_API_KEY: ${{ secrets.HOSTAWAY_API_KEY }}
          HOSTAWAY_ACCOUNT_ID: ${{ secrets.HOSTAWAY_ACCOUNT_ID }}
          OUT: available-soon.json
        run: node build-feed.mjs
      - name: Commit if changed
        run: |
          git config user.name "nosbaan-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add available-soon.json
          git diff --cached --quiet && echo "No change" || (git commit -m "Update available-soon feed" && git push)
